name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release:
        description: '创建 Release 并上传 APK'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        run: |
          set -e
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"
          curl -sSL --retry 3 --max-time 600 \
            -o cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline.zip
          mv cmdline-tools latest
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 生成签名密钥
        run: |
          if [ ! -f app/keystore.p12 ]; then
            keytool -genkeypair -v \
              -keystore app/keystore.p12 \
              -storetype PKCS12 \
              -storepass iptv123456 \
              -keypass iptv123456 \
              -alias iptvkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=IPTV, OU=Dev, O=totootao, L=Beijing, ST=Beijing, C=CN"
          fi

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/IPTV-release.apk || true
          cp app/build/outputs/apk/debug/*.apk out/IPTV-debug.apk || true
          ls -lh out/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-APK
          path: out/*.apk
          retention-days: 30

      - name: 生成版本号
        id: ver
        run: |
          echo "tag=v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: 创建 Release
        if: github.event_name == 'push' || inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 怀旧剧场直播 ${{ steps.ver.outputs.tag }}
          body: |
            ## 怀旧剧场直播 IPTV

            根据 1970 纪元时间推算播放位置的「伪直播」电视应用。

            - 构建时间：${{ steps.ver.outputs.date }}
            - 提交：${{ github.sha }}

            ### 安装说明
            1. 下载下方 `IPTV-release.apk`
            2. 在电视/盒子上允许「未知来源安装」
            3. 用 U 盘拷贝安装，或通过 `adb install IPTV-release.apk`

            ### 操作
            - 遥控器 **上下键**：切换电视剧
            - 遥控器 **确认键**：切换到选中剧集
            - 遥控器 **菜单键**：刷新节目单
          files: out/*.apk
          draft: false
          prerelease: false
